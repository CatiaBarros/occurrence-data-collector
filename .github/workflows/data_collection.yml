name: Atualizar Ocorrências PROCIV

on:
  # O disparo principal vem de fora: o cron-job.org chama o workflow_dispatch
  # de 30 em 30 minutos (o agendamento do GitHub atrasa e salta corridas).
  workflow_dispatch:
  # Reserva, caso o cron-job.org falhe: de 3 em 3 horas, ao minuto 17.
  schedule:
    - cron: '17 */3 * * *'

# Nunca correr duas atualizações ao mesmo tempo (evita conflitos no push).
concurrency:
  group: atualizar-ocorrencias
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # O espelho da Azure (azure.archive.ubuntu.com) às vezes pendura e o apt fica
      # à espera até o job morrer aos 15 minutos. Tira-se esse espelho da lista
      # (fica o archive.ubuntu.com oficial) e dão-se ao apt timeouts curtos e novas tentativas.
      - name: Configurar apt
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null

      # use-public-rspm descarrega os pacotes já compilados (Posit Package Manager),
      # em vez de compilar o sf de raiz em cada corrida.
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # Instala os pacotes e as bibliotecas de sistema de que precisam (GDAL, GEOS, PROJ),
      # e guarda tudo em cache entre corridas.
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::dplyr
            any::sf
            any::readr

      # Se a API falhar, o script termina com erro sem tocar nos ficheiros,
      # e o passo seguinte não corre: fica publicada a última versão boa.
      - name: Run script
        run: Rscript collect_data.R

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git commit -m "Atualização: $(TZ=Europe/Lisbon date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
